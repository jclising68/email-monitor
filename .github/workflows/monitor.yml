name: Email Monitor

on:
  schedule:
    # Every 2 hours at :00 EXCEPT 4 AM UTC (handled by the daily cron)
    - cron: '0 0,2,6,8,10,12,14,16,18,20,22 * * *'
    # 4 AM UTC = 12 PM PHT — daily report (+ weekly on Monday, detected in script)
    - cron: '0 4 * * *'
  workflow_dispatch:       # Allow manual runs from GitHub UI
    inputs:
      report:
        description: 'Send daily Slack report?'
        required: false
        default: 'false'
      weekly_report:
        description: 'Send weekly domain health report?'
        required: false
        default: 'false'

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          SLACK_WEBHOOK_URL:        ${{ secrets.SLACK_WEBHOOK_URL }}
          GOOGLE_SHEETS_ID:         ${{ secrets.GOOGLE_SHEETS_ID }}
          GOOGLE_TOKEN_JSON_B64:    ${{ secrets.GOOGLE_TOKEN_JSON_B64 }}
          ZAPMAIL_API_KEY:          ${{ secrets.ZAPMAIL_API_KEY }}
          MAX_RECONNECT_ATTEMPTS:   '5'
          ZAPMAIL_REALERT_HOURS:    '0'
          HEALTH_SCORE_ALERT_THRESHOLD: '80'
          HEALTH_SCORE_CRITICAL_THRESHOLD: '60'
          SPAM_RATE_ALERT_THRESHOLD: '10'
          BOUNCE_RATE_ALERT_THRESHOLD: '5'
          LOG_LEVEL:                'INFO'
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          DAY_OF_WEEK=$(date -u +%u)  # 1=Monday, 7=Sunday

          # Manual: weekly report requested
          if [ "${{ github.event.inputs.weekly_report }}" = "true" ]; then
            echo "Running daily + weekly domain health report (manual)..."
            python monitor.py --report --weekly-report
          # Manual: daily report requested
          elif [ "${{ github.event.inputs.report }}" = "true" ]; then
            echo "Running daily report (manual)..."
            python monitor.py --report
          # Scheduled: 4 AM UTC = 12 PM PHT — daily report (+ weekly on Monday)
          elif [ "$SCHEDULE" = "0 4 * * *" ]; then
            if [ "$DAY_OF_WEEK" = "1" ]; then
              echo "Running daily + weekly domain health report (Monday)..."
              python monitor.py --report --weekly-report
            else
              echo "Running daily report..."
              python monitor.py --report
            fi
          # Scheduled: every other 2-hour slot — hourly check only
          else
            echo "Running hourly check..."
            python monitor.py
          fi
